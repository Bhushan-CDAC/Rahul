
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Proposal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ffb6c1, #ffffff); /* Baby pink to white gradient */
            color: #ff0000; /* Red for love theme */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .buttons {
            margin-top: 30px;
        }
        button {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #yes {
            background-color: #ffb6c1; /* Cute pink */
            color: white;
        }
        #no {
            background-color: white;
            color: #ff0000;
            border: 2px solid #ff0000;
        }
        .hidden {
            display: none;
        }
        .celebration {
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        .heart {
            color: #ff0000;
            font-size: 2em;
        }
        img {
            max-width: 300px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rahul, will you be my valentine?</h1>
        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
        <div id="celebration" class="hidden">
            <p class="celebration">Yay! Best decision ever! I love you!</p>
            <img src="https://media.giphy.com/media/3o7TKz9bX9v9Kz9b9K/giphy.gif" alt="Love GIF"> <!-- Placeholder GIF, replace with your own -->
            <p>I love you <span class="heart">❤️</span></p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');
        const celebration = document.getElementById('celebration');
        const buttons = document.querySelector('.buttons');

        let yesSize = 1; // Initial scale for yes button

        yesBtn.addEventListener('click', () => {
            buttons.classList.add('hidden');
            celebration.classList.remove('hidden');
        });

        noBtn.addEventListener('click', () => {
            // Move no button to random position
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const maxX = containerRect.width - btnRect.width;
            const maxY = containerRect.height - btnRect.height;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Make yes button bigger
            yesSize += 0.2;
            yesBtn.style.transform = `scale(${yesSize})`;
        });
    </script>
</body>
</html>
