<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Proposal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ffb6c1, #ffffff); /* Baby pink to white gradient */
            color: #ff1493; /* Deep pink for text */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .question {
            font-size: 2em;
            margin-bottom: 40px;
        }
        button {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #yes {
            background-color: #ff69b4; /* Hot pink */
            color: white;
        }
        #no {
            background-color: white;
            color: #ff1493;
            position: relative;
        }
        .hidden {
            display: none;
        }
        .message {
            font-size: 2.5em;
            margin-top: 20px;
        }
        .gif {
            margin-top: 20px;
        }
        .heart {
            color: #ff0000;
            font-size: 2em;
        }
        .tip {
            font-size: 1.5em;
            margin-top: 20px;
            color: #ff1493;
        }
        .smiley {
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div id="proposal">
        <h1>Rahul</h1>
        <div class="question">will you be my valentine?</div>
        <button id="yes">Yes</button>
        <button id="no">No</button>
    </div>
    <div id="response" class="hidden">
        <div class="message">yay best decision ever</div>
        <div class="gif">
            <img src="https://media.giphy.com/media/3o7TKz9bX9v8zJZGd6/giphy.gif" alt="Cute animation" width="300">
        </div>
        <div class="message">i love you <span class="heart">❤️</span></div>
        <div id="tip" class="tip hidden">
            ५००० पाठवून दे valentine सेलेब्रेट करायला <span class="smiley">😊</span>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');
        const proposal = document.getElementById('proposal');
        const response = document.getElementById('response');
        const tip = document.getElementById('tip');

        let yesSize = 1;

        noBtn.addEventListener('click', () => {
            // Move No button to random position
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            // Make Yes button bigger
            yesSize += 0.2;
            yesBtn.style.transform = `scale(${yesSize})`;
        });

        yesBtn.addEventListener('click', () => {
            // Hide proposal and show response
            proposal.classList.add('hidden');
            response.classList.remove('hidden');
            tip.classList.remove('hidden');

            // Add cute animation (pulse effect)
            response.style.animation = 'pulse 1s infinite';
        });

        // CSS animation for pulse
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
