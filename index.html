<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Proposal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .buttons {
            margin-top: 40px;
        }
        button {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        #yes {
            background-color: #ff69b4;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #no {
            background-color: white;
            color: #ff6b6b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #message {
            font-size: 2em;
            margin-top: 20px;
            display: none;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .heart {
            position: absolute;
            font-size: 2em;
            color: #ff69b4;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <h1>Rahul, will you be my Valentine?</h1>
    <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>
    </div>
    <div id="message"></div>

    <script>
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');
        const message = document.getElementById('message');
        let yesSize = 1;

        yesBtn.addEventListener('click', () => {
            message.textContent = "Yay! Best decision ever! I love you! ❤️";
            message.style.display = 'block';
            // Add cute animation: floating hearts
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }
        });

        noBtn.addEventListener('click', () => {
            // Move No button to random position
            noBtn.style.position = 'absolute';
            noBtn.style.left = Math.random() * (window.innerWidth - 150) + 'px';
            noBtn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            
            // Make Yes button bigger
            yesSize += 0.2;
            yesBtn.style.transform = `scale(${yesSize})`;
        });
    </script>
</body>
</html>
