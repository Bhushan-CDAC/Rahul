<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Proposal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #FFB6C1, #FFFFFF); /* Baby pink to white gradient */
            color: #FF1493; /* Deep pink for text */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin: 0;
        }
        h2 {
            font-size: 2.5em;
            margin: 0;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            font-size: 1.5em;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #yes {
            background-color: #FF69B4; /* Hot pink */
            color: white;
        }
        #no {
            background-color: white;
            color: #FF1493;
            position: relative;
        }
        .hidden {
            display: none;
        }
        .celebration {
            font-size: 2em;
            margin-top: 20px;
        }
        .gif {
            margin-top: 20px;
        }
        .heart {
            color: red;
            font-size: 2em;
        }
        .tip {
            font-size: 1.2em;
            margin-top: 30px;
            color: #333;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        .animate {
            animation: bounce 1s infinite;
        }
    </style>
</head>
<body>
    <div id="proposal">
        <h1>Rahul</h1>
        <h2>will you be my valentine?</h2>
        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
    </div>
    <div id="celebration" class="hidden">
        <div class="celebration">Yay! Best decision ever!</div>
        <div class="gif">
            <img src="https://media.giphy.com/media/3o7TKz9bX9v8Z8Z8Z8/giphy.gif" alt="Cute hearts animation" width="300">
        </div>
        <div class="celebration">I love you <span class="heart">❤️</span></div>
    </div>
    <div class="tip">
        Tip: 5000 रुपयांनी व्हॅलेंटाईन सेलिब्रेट करायला!
    </div>

    <script>
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');
        const proposal = document.getElementById('proposal');
        const celebration = document.getElementById('celebration');
        let yesSize = 1.5; // Initial font size multiplier

        yesBtn.addEventListener('click', () => {
            proposal.classList.add('hidden');
            celebration.classList.remove('hidden');
            celebration.classList.add('animate');
        });

        noBtn.addEventListener('click', () => {
            // Move No button to random position
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            // Make Yes button bigger
            yesSize += 0.2;
            yesBtn.style.fontSize = `${yesSize}em`;
            yesBtn.style.padding = `${10 * yesSize}px ${20 * yesSize}px`;
        });
    </script>
</body>
</html>
